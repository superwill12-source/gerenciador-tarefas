      - name: Salvar código no repositório
        if: steps.extract.outputs.extracted == 'true' && github.ref_type == 'branch'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Atualiza projeto para a versão 2" || true
          git push || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GerenciadorTarefas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GerenciadorTarefas-apk
          path: GerenciadorTarefas.apk

      # Define o nome da versão: usa a tag (v1.0.0) ou cria v0.2.<número do build>
      - name: Definir versão
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.2.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Criar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Gerenciador de Tarefas ${{ steps.ver.outputs.tag }}
          body: |
            APK de teste (debug). Instale permitindo "fontes desconhecidas".
            Para recursos completos, instale e ative o Shizuku.
          files: GerenciadorTarefas.apk
          make_latest: true
