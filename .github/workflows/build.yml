      # Salva o código no repositório (só na primeira vez)
      - name: Salvar código no repositório
        if: steps.extract.outputs.extracted == 'true' && github.ref_type == 'branch'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Adiciona código do projeto" || true
          git push || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GerenciadorTarefas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GerenciadorTarefas-apk
          path: GerenciadorTarefas.apk

      - name: Publicar em Releases (apenas em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GerenciadorTarefas.apk
